[project]
name = "mk1"
version = "0.1.0"
description = "Modeling methodology labs: tabular EDA, preprocessing and model selection, then image anomaly detection"
requires-python = ">=3.14"
dependencies = [
    "anomalib>=2.7.0",
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

# Makes the mk1 package installable, so lab*/run.py imports `from mk1...` from
# any directory without touching sys.path. uv installs it in editable mode, so
# __file__ stays inside the source tree — mk1/config.py derives every artifact
# path from it.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mk1"]

# CPU-only torch builds. The default PyPI wheels for Linux bundle the CUDA
# runtime, gigabytes this machine cannot use: it has no NVIDIA GPU, and lab 4
# reports CPU timings only. `explicit` keeps every other package on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
