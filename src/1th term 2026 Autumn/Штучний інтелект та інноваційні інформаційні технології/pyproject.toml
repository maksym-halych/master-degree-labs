[project]
name = "ai-innovative-it-labs"
version = "0.1.0"
description = "Лабораторні роботи 1-2: побудова та аналіз моделей ШІ у TensorFlow і PyTorch"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorflow-cpu>=2.18,<2.21",
    "torch>=2.6",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26,<2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

# Робить пакет aiit встановлюваним, тому lab*/run.py імпортують `from aiit...`
# з будь-якої теки, без правок sys.path. uv ставить його в режимі editable, тож
# __file__ лишається в дереві вихідних кодів — на цьому тримається обчислення
# шляхів до артефактів в aiit/config.py.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiit"]

# CPU-only wheels: the default PyPI `torch` pulls ~2.5 GB of CUDA libraries that
# are useless on this machine (no NVIDIA GPU).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
