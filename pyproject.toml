[project]
name = "lecture-transcriber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.8.0",
    "click>=8.5.0",
    "google-api-python-client>=2.200.0",
    "openai>=3.19.2",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
]

[project.scripts]
lecture-transcriber = "lecture_transcriber.__main__:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ty>=0.0.84",
    "types-pyyaml>=6.0.12.20260906",
]
